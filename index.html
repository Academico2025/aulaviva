<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal de Bots Escolares</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #c8e6c9);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 650px;
            width: 90%;
        }
        h1 {
            color: #2e7d32;
            margin-bottom: 20px;
            font-size: 2.2em;
        }
        p {
            color: #555;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 20px 0;
        }
        a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 18px 24px;
            background-color: #4caf50;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }
        a:hover {
            background-color: #388e3c;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(56, 142, 60, 0.4);
        }
        .emoji {
            font-size: 1.8em;
        }
    </style>
</head>
<body>
    <!-- Sonido de bienvenida -->
    <audio id="welcome-sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_38b15256a3.mp3?filename=success-1-6297.mp3" preload="auto"></audio>

    <div class="container">
        <h1>Plataforma de Bots Escolares</h1>
        <h3>DISRUPCIÓN DIGITAL Y SU IMPACTO EN LA EDUCACIÓN UNAD 2025</h3>
        <h3>Yesenia Muñoz Ruiz</h3>
        <p>Elige tu bot favorito y aprende mientras te diviertes 😄</p>
        <ul>
            <li><a href="NaturaBotEscolar/index2.html" data-title="Natura Bot Escolar"><span class="emoji">🌳</span> NaturaBotEscolar</a></li>
            <li><a href="EticoBotEscolar/index2.html" data-title="Ético Bot Escolar"><span class="emoji">🤝</span> EticoBotEscolar</a></li>
            <li><a href="InglesBotEscolar/index.html" data-title="Inglés Bot Escolar"><span class="emoji">🇬🇧</span> InglésBotEscolar</a></li>
            <li><a href="MatBotEscolar/index2.html" data-title="Matemáticas Bot Escolar"><span class="emoji">🔢</span> MatBotEscolar</a></li>
            <li><a href="LenguBotEscolar/index2.html" data-title="Lengua Bot Escolar"><span class="emoji">📚</span> LenguBotEscolar</a></li>
        </ul>
    </div>

    <script>
        // Reproducir sonido de bienvenida al cargar la página
        window.addEventListener('load', () => {
            const sound = document.getElementById('welcome-sound');
            sound.play().catch(() => {
                console.log("El sonido se reproducirá al interactuar con la página (bloqueo del navegador).");
            });
        });

        // Configurar lectura de botones con voz
        const links = document.querySelectorAll('a');
        links.forEach(link => {
            link.addEventListener('mouseenter', () => {
                const texto = link.getAttribute('data-title');
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-ES';
                utterance.rate = 1;
                speechSynthesis.speak(utterance);
            });
        });
    </script>
</body>
</html>
